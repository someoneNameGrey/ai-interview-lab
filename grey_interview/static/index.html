<!doctype html>
<html lang="en">

  <link rel="stylesheet" href="/app.css">

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#/learn"><span class="brand-mark">g.</span><span>GREY<small>INTERVIEW LAB</small></span></a>
      <nav class="main-nav" aria-label="Main"><a href="#/learn" data-nav="learn">Learn</a><a href="#/practice" data-nav="practice">Practice</a><a href="#/readiness" data-nav="readiness">Readiness</a><a href="#/sessions" data-nav="sessions">Sessions</a></nav>

      <nav id="course-nav" aria-label="Lessons"><span class="muted">Loading lessons…</span></nav>
      <div class="sidebar-footer"><span class="local-label">LOCAL WORKSPACE</span><div id="provider-info"></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><span id="breadcrumb">Learning workspace</span><a href="#/readiness" class="text-link">View readiness <span aria-hidden="true">↗</span></a></header>

      <div id="notice" class="notice" role="alert" hidden></div>
      <div class="mobile-courses"><label for="mobile-lesson">Choose a lesson</label><select id="mobile-lesson"></select></div>
      <main id="main" tabindex="-1"><div class="loading-state">Opening your workspace…</div></main>
    </div>
  </div>
  <noscript>This workspace needs JavaScript for the editor and saved progress. The CLI remains available with grey learn.</noscript>
